name: Update World

on:
  schedule:
    # 7am, 1pm, and 7pm US Eastern (11:00, 17:00, 23:00 UTC during EDT)
    - cron: "0 11,17,23 * * *"
  workflow_dispatch:

concurrency:
  group: update-world
  cancel-in-progress: false

jobs:
  update-world:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run World Critical update pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/update_world.py
